name: CI

# どのブランチに push しても、lint・ビルド・テストを実行する。
# main へ push されたときは、テストが通ったら Firestore のルールを自動で本番に反映する。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-app-new
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            my-app-new/package-lock.json
            my-app-new/test/package-lock.json

      # Firestore エミュレータは Java で動く
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install test dependencies
        working-directory: my-app-new/test
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: my-app-new/test
        run: npx playwright install --with-deps chromium

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('my-app-new/test/package-lock.json') }}

      - name: Test (Firestore rules + E2E on emulators)
        working-directory: my-app-new/test
        run: npm test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: my-app-new/test/shots
          if-no-files-found: ignore

  deploy-rules:
    name: Deploy Firestore rules
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: my-app-new
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT が未設定のため、ルールの自動反映をスキップしました（FIREBASE_SETUP.md 参照）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Deploy firestore.rules
        if: steps.creds.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project tvxq-live-archive --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
